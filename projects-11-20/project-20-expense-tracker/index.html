<!DOCTYPE html>
<html>
  <head>
    <title>Expense Tracker</title>
    <style>
      body { font-family: sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
      .expense { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
      .deleteBtn { background: none; border: none; color: red; cursor: pointer; font-size: 1rem; margin-left:10px;}
    </style>
  </head>
  <body>
    <h1>Expense Tracker</h1>
    <h2 id="total">Total: £0</h2>
    <input id="expenseName" type="text" placeholder="Expense name" />
    <input id="expenseAmount" type="number" placeholder="Amount (£)" />
    <button id="addBtn">Add expense</button>
    <ul id="expenseList"></ul>
    <script src="expense-tracker-blind-rebuild.js"></script>
  </body>
</html>
